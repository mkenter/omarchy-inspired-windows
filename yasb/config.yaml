# Original starter; authored from the requested behavior and official YASB API.
watch_config: false
watch_stylesheet: false
bars:
  fresh-bar:
    enabled: true
    screens: ['*']
    class_name: fresh-bar
    alignment:
      position: top
    dimensions:
      width: '100%'
      height: 26
    window_flags:
      windows_app_bar: true
    widgets:
      left: [launcher, workspaces]
      center: [clock]
      right: [tray, bluetooth, network, volume]
widgets:
  launcher:
    type: yasb.custom.CustomWidget
    options:
      label: "<span>\ue782</span>"
      class_name: raycast-button
      tooltip: true
      tooltip_label: Open Raycast
      callbacks:
        on_left: 'exec explorer.exe shell:AppsFolder\Raycast.Raycast_qypenmj9wpt2a!Raycast'
  workspaces:
    type: komorebi.workspaces.WorkspaceWidget
    options:
      label_workspace_btn: '{index}'
      label_workspace_populated_btn: '{index}'
      label_workspace_active_btn: '■'
      hide_empty_workspaces: false
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%A %H:%M}'
      label_alt: '{%d %B %Y %H:%M}'
      callbacks:
        on_left: toggle_calendar
        on_right: toggle_label
      calendar:
        blur: false
        round_corners: false
        show_holidays: false
        show_week_numbers: false
        extended: false
        alignment: center
        direction: down
  tray:
    type: yasb.systray.SystrayWidget
    options:
      label_collapsed: "\ue76b"
      label_expanded: "\ue76c"
      label_position: left
      show_unpinned: false
      show_unpinned_button: true
      show_in_popup: false
      icon_size: 14
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: '<span>{icon}</span>'
      callbacks:
        on_left: toggle_volume_menu
  bluetooth:
    type: yasb.bluetooth.BluetoothWidget
    options:
      label: "<span>\ue702</span>"
      menu_config:
        blur: false
        round_corners: false
        alignment: right
        direction: down
  network:
    type: yasb.wifi.WifiWidget
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: '{wifi_name} {ip_addr}'
      ethernet_label: "<span>{wifi_icon}</span>"
      ethernet_label_alt: '{ip_addr}'
      ethernet_icon: "\ue839"
      wifi_icons: ["\ue704", "\ue871", "\ue872", "\ue873", "\ue874"]
      callbacks:
        on_left: 'exec cmd.exe /c start ms-settings:network'
        on_right: toggle_label
